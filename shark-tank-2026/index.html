ition reduction and complaints, not response rate alone."],"options":["Target onboarding friction for student/new-credit accounts.","Test service-recovery contact among early-career accounts.","Launch a broad incentive with a control group."],"questions":["Which segment adds the most estimated closures?","What would distinguish pricing from service friction?","How would you estimate causal incremental retention?"],"definitions":"90-day attrition = closed accounts / starting accounts. Counts and rates are simulated."},{"id":"global-lending-services","co":"Global Lending Services","ind":"Auto Finance","role":"Financial Analyst","challenge":"30+ day loan delinquency increased across multiple tiers. Who needs earlier help?","decision":"Prioritize one segment for a fair servicing intervention and select a measurable result.","tables":[["Portfolio performance",["Risk tier","Active loans","Prior 30+ DPD","Current 30+ DPD","Avg loan balance"],[["Prime","30,000","2.1%","2.5%","$24,000"],["Near-prime","24,000","4.9%","6.6%","$20,000"],["Subprime","18,000","9.5%","11.0%","$17,000"],["Thin-file","10,000","7.2%","9.1%","$16,000"]]],["Servicing indicators",["Risk tier","Alerts delivered","Reached ≤7d","Cure after contact","Digital opt-in"],[["Prime","82%","71%","62%","55%"],["Near-prime","74%","58%","46%","40%"],["Subprime","64%","42%","34%","27%"],["Thin-file","59%","39%","30%","24%"]]]],"voices":[["Risk officer","Model expected balance at risk, not just delinquency percentages."],["Borrower support","Outreach must be respectful and comply with fair lending and servicing rules."]],"limits":["$80,000 additional outreach budget for 60 days.","Outreach results are descriptive; a cure after contact is not proof of causation.","Monitor fairness, repayment support, borrower experience and cures."],"options":["Target near-prime new delinquencies.","Improve early self-service reminders for opt-in borrowers.","Use a staggered test across tiers with safeguards."],"questions":["How many extra delinquent accounts arose in each tier?","Where is the largest dollar exposure?","What outcome would show the pilot caused improvement?"],"definitions":"DPD = days past due; cure = account returned to current status. Tiers are non-overlapping; all data simulated."},{"id":"ralph-lauren","co":"Ralph Lauren","ind":"Retail / Consumer Products","role":"Data Analyst","challenge":"Online traffic increased but conversion fell. Is inventory or pricing the culprit?","decision":"Choose one merchandizing or digital test with a margin-aware KPI.","tables":[["Digital performance",["Category","Visits","Prior conversion","Current conversion","Out-of-stock views"],[["Knitwear","180,000","3.6%","2.8%","8.2%"],["Footwear","150,000","3.1%","2.3%","12.8%"],["Accessories","210,000","2.5%","2.4%","2.9%"],["Outerwear","110,000","3.4%","2.7%","5.1%"]]],["Other commercial signals",["Category","Avg order value","Price change","Promo redeemed","Return rate"],[["Knitwear","$126","+6%","14%","11%"],["Footwear","$154","+2%","9%","18%"],["Accessories","$78","+1%","11%","7%"],["Outerwear","$230","+8%","8%","13%"]]]],"voices":[["Merchant lead","Inventory moves take three weeks. We need something measurable soon."],["Digital lead","A new campaign changed visitor mix; do not blame prices without checking cohorts."]],"limits":["$40,000 test budget; only select SKUs may be reallocated.","Discounting may boost orders while damaging gross profit.","Traffic composition changed, so simple before/after comparisons can mislead."],"options":["Fix size availability and stock messaging in footwear.","A/B test offer framing for outerwear.","Test search and product discovery rather than promotions."],"questions":["Which category has the largest implied order shortfall?","What evidence supports an inventory hypothesis?","What is the profit-based success KPI?"],"definitions":"Conversion = orders/visits. Out-of-stock view = product view without selected size available. All figures simulated."},{"id":"the-home-depot","co":"The Home Depot","ind":"Retail / Operations","role":"Business Analyst","challenge":"The same seasonal item is out of stock in some regions and overstocked in others.","decision":"Select a transfer plan that improves availability and has a positive expected economic impact.","tables":[["Regional inventory",["Region","Demand/day","Units on hand","Stockout days/30d","Inbound lead time"],[["Southeast","480","2,400","9","8d"],["Northeast","310","5,580","2","11d"],["Midwest","250","6,250","1","9d"],["West","390","2,730","7","12d"]]],["Transfer options",["Origin → destination","Truck units","Transit","Cost/truck","Handling loss"],[["Midwest → Southeast","1,000","3d","$3,500","1.0%"],["Northeast → Southeast","1,000","4d","$4,100","1.0%"],["Midwest → West","1,000","5d","$5,200","1.5%"],["Northeast → West","1,000","6d","$5,800","1.5%"]]]],"voices":[["Store operations","Every day without stock means missed sales now."],["Finance","Do not move inventory unless recovered contribution exceeds transport and loss."]],"limits":["Gross margin: $28 per sold unit; no close substitute product.","Each donor must retain at least 10 days of supply.","No more than four transfer trucks available this week."],"options":["Prioritize Southeast from Midwest stock.","Split emergency capacity between Southeast and West.","Wait for inbound replenishment and invest in forecasting."],"questions":["Compute days of supply by region.","Which donor can spare units and preserve its minimum cover?","How many incremental sales must each transfer recover to break even?"],"definitions":"Days of supply = units on hand/demand per day. Figures are simulated."},{"id":"deloitte","co":"Deloitte","ind":"Consulting / Advisory","role":"Consultant","challenge":"A client's automation rollout reduced simple-ticket time but made overall service slower.","decision":"Present a root-cause hypothesis and a six-week client improvement pilot.","tables":[["Service journey impact",["Journey","Monthly tickets","Before median","After median","Post escalation"],[["Password/access","12,000","14 min","9 min","8%"],["Billing disputes","8,000","35 min","58 min","39%"],["Returns/refunds","7,000","28 min","44 min","32%"],["Product questions","5,000","24 min","22 min","14%"]]],["Operational signals",["Indicator","Pre-launch","Post-launch","Potential issue"],[["First-contact resolution","72%","61%","Misrouting?"],["Transfers per ticket","1.3","2.1","More handoffs?"],["Staff training","6h","1.5h","Readiness?"],["Satisfaction","4.4/5","3.8/5","Customer impact?"]]]],"voices":[["CIO","Routine tasks improved; reversing all automation would waste the gain."],["Service manager","Exception handling is unclear and training was rushed."]],"limits":["Pilot budget $90,000; no full rollback without security approval.","Billing cases require compliance and audit controls.","Present owner, KPI, 2-week checkpoint and 6-week assessment."],"options":["Redesign billing and returns exception routing.","Add targeted staff training and escalation rules.","Temporarily route complex journeys to specialists."],"questions":["Which journey accounts for the greatest added total minutes?","What is the difference between correlation and a root cause?","Which metric balances speed with resolution quality?"],"definitions":"Median resolution time is per-ticket; multiplying medians by counts is an approximation, not exact time cost. All figures simulated."},{"id":"pwc","co":"PwC","ind":"Consulting / BI","role":"Business Intelligence Analyst","challenge":"Four divisions report the same 'on-time' KPI with incompatible definitions.","decision":"Design a standardized board metric and 30-day reconciliation plan.","tables":[["Reported dashboards",["Division","Cases","On-time cases","Reported rate","Excluded"],[["North America","1,200","1,104","92.0%","Rush"],["Europe","1,000","840","84.0%","None"],["Asia-Pacific","800","768","96.0%","Exceptions"],["Latin America","600","528","88.0%","Weekends"]]],["Hidden definitions",["Division"," 9%","15%","Mixed"]]]],"voices":[["Marketing VP","I want lift we caused—not sales that would have occurred anyway."],["Data science lead","The controls are matched, not randomized, and campaigns overlapped."]],"limits":["$100,000 for next wave across at most two offers.","Do not calculate ROI from observed lift alone.","Build proper holdouts and test for customer overlap."],"options":["Prioritize net-of-control incremental lift.","Prioritize contribution net of cost.","Do a cleaner randomized holdout before scaling."],"questions":["Compute the difference in percentage-point lift for each offer.","Which offer has the strongest apparent incremental impact?","Why do you still need baseline spending and controls?"],"definitions":"HH = household. Control-adjusted lift (pp) ≈ exposed lift minus control lift; not proof of causal effect. Simulated."},{"id":"epic","co":"Epic","ind":"Health IT","role":"Business Analyst","challenge":"A hospital workflow system was implemented, but several units barely use it.","decision":"Choose one adoption barrier to test safely over six weeks.","tables":[["Unit adoption",["Unit","Eligible cases/week","Week 1","Week 8","Extra clicks"],[["Emergency","1,600","33%","46%","12"],["Outpatient","2,400","48%","79%","5"],["Medical-surgical","1,200","41%","55%","10"],["Imaging","900","38%","72%","4"]]],["Friction",["Unit","Support tickets/100","Field errors","Training attend","Safety flags"],[["Emergency","19","14%","61%","3"],["Outpatient","7","5%","93%","0"],["Medical-surgical","16","11%","70%","1"],["Imaging","8","4%","88%","0"]]]],"voices":[["Nurse leader","Patient safety comes before an adoption target."],["IT director","Changes need clinician approval and a reversible test."]],"limits":["Six weeks, 120 total configuration/analyst hours.","No identifiable patient records in this exercise.","Require clinical review; track safety, burden and appropriate adoption."],"options":["Simplify emergency workflow steps.","Train staff in units with low uptake.","Use contextual in-app prompts with safeguards."],"questions":["Which unit offers the largest count of additional appropriately completed cases?","Is low adoption due to clicks, training or case mix?","How do you avoid maximizing unsafe usage?"],"definitions":"Adoption = eligible cases using the new workflow. Extra clicks relative to prior workflow. Simulated."},{"id":"wellnecity","co":"Wellnecity","ind":"Healthcare Analytics","role":"Healthcare Business Analyst","challenge":"A benefits sponsor sees more potentially avoidable emergency-department claims.","decision":"Target a safe navigation pilot that can improve care access without deterring emergency care.","tables":[["ED utilization",["Segment","Members","Prior visits/1k","Current visits/1k","No PCP visit (12m)"],[["Chronic condition adults","8,000","142","174","26%"],["Young adults","11,000","96","128","41%"],["Families","14,000","84","91","18%"],["Older adults","5,000","112","119","14%"]]],["Access and cost",["Segment","Avg claim","After-hours gap","Claim lag","Navigator use"],[["Chronic condition adults","$1,450","28%","45d","21%"],["Young adults","$980","35%","45d","8%"],["Families","$1,120","18%","45d","15%"],["Older adults","$1,680","11%","45d","24%"]]]],"voices":[["Benefits director","We need evidence that access improves, not just a claims reduction."],["Clinical advisor","Claims coding cannot decide whether any individual ED visit was medically necessary."]],"limits":["$180,000 pilot for 90 days; up to 5,000 outreach contacts.","Analyze only aggregated/de-identified data.","Protect urgent-care access and evaluate patient experience."],"options":["Offer primary-care navigation to young adults.","Prioritize chronic-condition outreach and after-hours alternatives.","Validate coding before large expansion."],"questions":["Compute approximate additional visits in each group.","What would test whether access is the driver?","What clinical safety and equity guardrails are essential?"],"definitions":"ED rate  performance",["Service","Shipments","Target days","Actual median","Late rate"],[["Ocean standard","600","28","36","41%"],["Ocean priority","240","25","29","23%"],["Air economy","180","8","10","17%"],["Multimodal","120","22","25","26%"]]],["Delay signals and options",["Service","Port dwell","Customs exams","Capacity roll","Premium/shipment"],[["Ocean standard","6.2d","9%","18%","$0"],["Ocean priority","3.1d","7%","9%","+$650"],["Air economy","0.7d","5%","4%","+$2,800"],["Multimodal","2.4d","6%","11%","+$900"]]]],"voices":[["Operations","Premium services help, but we cannot send everything by air."],["Customer success","Customers value predictable arrival windows, not only speed."]],"limits":["Incremental budget: $150,000 next month.","At most 200 standard shipments may switch to priority.","Customs inspections are not fully controllable."],"options":["Prioritize upgrades on high-risk ocean shipments.","Move bookings earlier to avoid capacity rolls.","Focus on customs data readiness and destination dwell."],"questions":["Estimate number of late shipments per service.","How many $650 upgrades could the budget fund?","What data differentiates port dwell from rolled capacity?"],"definitions":"Late rate = shipments after the target; cause signals can overlap. All figures simulated."},{"id":"red-ventures","co":"Red Ventures","ind":"Digital Marketing","role":"Marketing Analyst","challenge":"Marketing spend rose yet sales-qualified leads barely moved.","decision":"Recommend a budget/targeting experiment using cost per qualified lead plus quality safeguards.","tables":[["Current funnel",["Channel","Spend","Visits","Leads","Qualified"],[["Paid search","$180k","120,000","7,200","1,080"],["SEO/content","$55k","150,000","6,750","1,350"],["Display","$120k","200,000","6,000","540"],["Email/CRM","$35k","80,000","4,800","1,200"]]],["Comparison and overlap",["Channel","Prior spend","Prior qualified","Current qualified","Multi-touch"],[["Paid search","$130k","1,000","1,080","16%"],["SEO/content","$50k","1,300","1,350","25%"],["Display","$75k","520","540","34%"],["Email/CRM","$30k","1,150","1,200","41%"]]]],"voices":[["Marketing","We need a better return on incremental spend, not just impressions."],["Sales operations","Qualified lead definitions and duplicate attribution matter."]],"limits":["Next-month $60,000 experiment; sales headcount fixed.","Last-click attribution may overcredit some channels.","Track quality and downstream sales acceptance."],"options":["Reduce incremental display and test SEO/CRM.","Tighten paid-search targeting via randomized split.","Standardize qualified conversion definitions before scaling."],"questions":["Calculate cost per qualified lead.","Which channel grew leads relative to spend?","How would you detect attribution double counting?"],"definitions":"Qualified = sales-accepted lead; multi-touch prospects saw multiple channels. Simulated."},{"id":"tepper-sports","co":"Tepper Sports & Entertainment","ind":"Sports Business Analytics","role":"Fan Insights Analyst","challenge":"Younger season-ticket holders are renewing at much lower rates.","decision":"Recommend an opt-in fan-retention pilot and the experiment to evaluate incremental renewal.","tables":[["Ticket renewal cohorts",["Age","Eligible holders","Prior renewal","Current renewal","Games attended"],[["18–29","3,000","73%","58%","5.2"],["30–44","4,000","79%","73%","7.1"],["45–59","4,500","85%","83%","8.8"],["60+","2,500","89%","88%","10.2"]]],["Fan economics and engagement",["Age","App engagement","Event participation","Plan price","Contribution/renewal"],[["18–29","34%","16%","$620","$290"],["30–44","52%","24%","$1,050","$510"],["45–59","68%","32%","$1,480","$760"],["60+","71%","29%","$1,620","$840"]]]],"voices":[["Fan experience","Young fans ask for flexible use more than blanket discounts."],["Finance","Pilot benefits must not cost more than incremental renewal contribution."]],"limits":["$200,000 budget, maximum 2,000 pilot accounts.","Only opt-in communications; monitor fan satisfaction.","Randomized control needed to isolate intervention effect."],"options":["Flexible game swaps for young holders.","Targeted experiences for 30–44 accounts.","Segmented renewal messaging tested against holdout."],"questions":["Estimate lost renewals among 18–29 holders.","What incentive can the unit economics support?","Which leading KPIs predict renewal but don't substitute for it?"],"definitions":"Renewal % = renewed/eligible. Contribution is after variable costs. Simulated; not real team business data."},{"id":"charlotte-hornets","co":"Charlotte Hornets","ind":"Sports / Basketball Operations","role":"Basketball Operations Analyst","challenge":"Two possible roster additions have similar box-score averages, but different context and costs.","decision":"Choose a conditional fit-based recommendation and explain the biggest uncertainty.","tables":[["Two fictional candidates",["Metric","Player A","Player B","Interpretation"],[["Points per 36","18.6","18.4","Similar volume"],["True shooting","58.2%","56.5%","Efficiency"],["Usage","22%","26%","Role"],["3-point %","37.8%","39.4%","Spacing"],["Minutes sampled","1,600","2,500","Reliability"]]],["Fit, defense and price",["Metric","Player A","Player B","Interpretation"],[["Adjusted on/off/100","+5.2","+2.1","Context-sensitive"],["Defensive matchup difficulty","73/100","61/100","Higher = harder"],["Games missed","18","8","Availability"],["Annual salary ask","$9.2M","$8.6M","Budget"],["Role archetype","3-and-D wing","Scoring guard","Fit"]]]],"voices":[["Head coach","We need a strong perimeter defender who can play without heavy usage."],["General manager","Budget is ~$10M; we need upside and downside cases."]],"limits":["Candidates and stats are completely fictional and do not describe real players.","No game-tracking, opponent-adjusted film review or medical data available.","Do not treat adjusted on/off as a causal player impact measure."],"options":["Select A for low-usage defense, conditional
